# Copy .env.example to .env and fill in the values before running:
#   docker compose up -d --build

services:
  cobi:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Discord
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env}
      DISCORD_GUILD: ${DISCORD_GUILD:?Set DISCORD_GUILD in .env}
      DISCORD_APP: ${DISCORD_APP:?Set DISCORD_APP in .env}
      BLUE_TEAMS: ${BLUE_TEAMS:?Set BLUE_TEAMS in .env}

      # Database (matches the mysql service below)
      DB_USER: ${DB_USER:-cobi}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-cobi}

      # Tracing/logging. Leave empty to run without Uptrace.
      UPTRACE_DSN: ${UPTRACE_DSN:-}

  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_USER: ${DB_USER:-cobi}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-cobi}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The bot exits if it can't connect on startup, so wait until MySQL
      # accepts logins as the bot's user
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
